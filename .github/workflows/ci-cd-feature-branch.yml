name: CI for Feature Branches

on:
  push:
    branches:
      # - staging
      # - testing
      - frontend-1
      - frontend-2
      - backend-1
      - backend-2

#

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      - name: Install dependencies for frontend
        run: |
          cd client
          npm install

      - name: Install dependencies for backend
        run: |
          cd server
          npm install

      # - name: Run tests for frontend
      #   run: |
      #     cd client
      #     npm test

      # - name: Run tests for backend
      #   run: |
      #     cd server
      #     npm test

      - name: Build frontend
        run: |
          cd client
          npm run build

      # - name: Build backend
      #   run: |
      #     cd server
      #     npm run build
