name: Staging Tests

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      - name: Install dependencies for frontend
        run: |
          cd client
          npm install

      - name: Install dependencies for backend
        run: |
          cd server
          npm install

      #   - name: Run tests for frontend
      #     run: |
      #       cd client
      #       npm test

      #   - name: Run tests for backend
      #     run: |
      #       cd server
      #       npm test

      - name: Build frontend
        run: |
          cd client
          npm run build

      #   - name: Build backend
      #     run: |
      #       cd server
      #       npm start
      #       pkill -f "npm start"

      #   - name: Merge into Testing Branch if tests pass
      #     run: |
      #       git fetch origin testing
      #       git checkout testing
      #       git merge staging --no-ff -m "Merge staging into testing"
      #       git push origin testing
      - name: Merge feature branch into staging
        run: |
          git fetch origin testing
          git checkout testing
          git merge ${{ github.ref }} --no-ff -m "Merge feature branch ${{ github.head_ref }} into testing"
          git push https://github-actions:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }} testing

      - name: Create a commit status for feature branch merge
        run: |
          echo "The feature branch was successfully merged into staging!"
