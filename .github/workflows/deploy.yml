name: CI/CD Pipeline for EC2 Deployment

on:
  push:
    branches:
      - main # Trigger on push to the main branch, change if you use another branch
  pull_request:
    branches:
      - main # Trigger on PR to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from GitHub
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20" # Use the Node.js version of your choice

      - name: Install frontend dependencies
        run: |
          cd client  # Navigate to the frontend directory
          npm install

      - name: Build frontend
        run: |
          cd client  # Navigate to frontend folder
          npm run build  # Assuming the build script is configured in package.json

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: frontend-build
          path: client/dist # Upload the dist folder

      - name: Install backend dependencies
        run: |
          cd server  # Navigate to backend directory
          npm install

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v2
        with:
          name: backend
          path: server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code from GitHub
        uses: actions/checkout@v2

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v2
        with:
          name: frontend-build

      - name: Deploy frontend to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ${{ secrets.EC2_SSH_PRIVATE_KEY }} ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
            # On EC2, remove the old build and copy the new one
            sudo rm -rf /var/www/html/*
            sudo cp -r ~/frontend-build/* /var/www/html/
            sudo systemctl restart nginx  # Restart Nginx to serve new build
          EOF

      - name: Download backend artifacts
        uses: actions/download-artifact@v2
        with:
          name: backend

      - name: Deploy backend to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ${{ secrets.EC2_SSH_PRIVATE_KEY }} ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
            # On EC2, navigate to backend directory, install dependencies and start PM2
            cd ~/server  # Ensure you're in the backend directory
            npm install
            pm2 stop backend || true  # Stop the existing process if it exists
            pm2 start server.js --name backend  # Start your backend process with PM2
            pm2 save  # Save PM2 process list to restart on server reboot
          EOF
