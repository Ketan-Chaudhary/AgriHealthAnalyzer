name: CI/CD Pipeline for EC2 Deployment

on:
  push:
    branches:
      - main # Trigger on push to the main branch, change if you use another branch
  pull_request:
    branches:
      - main # Trigger on PR to the main
#backend changes2
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from GitHub
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20" # Use the Node.js version of your choice

      - name: Install frontend dependencies
        run: |
          cd client  # Navigate to the frontend directory
          npm install

      - name: Build frontend
        run: |
          cd client  # Navigate to frontend folder
          npm run build  # Assuming the build script is configured in package.json

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 # Set the region where your S3 bucket is located

      - name: Upload frontend build to S3
        run: |
          aws s3 cp client/dist s3://abekyanamerakhubhai/frontend-build/ --recursive

      - name: Install backend dependencies
        run: |
          cd server  # Navigate to backend directory
          npm install

      - name: Upload backend to S3
        run: |
          aws s3 cp server/ s3://abekyanamerakhubhai/backend/ --recursive

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Decode EC2 SSH Private Key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" | base64 --decode > private_key.pem
          chmod 600 private_key.pem  # Set the correct permissions for the private key

      - name: Deploy frontend to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
              # Ensure you're in the correct directory
              cd ~/client  # Navigate to the frontend directory
              npm install
              npm run build  # Rebuild the frontend if necessary
              sudo rm -rf /var/www/html/*  # Remove old build files
              sudo cp -r ~/client/dist/* /var/www/html/  # Copy new build to Nginx directory
              sudo systemctl restart nginx  # Restart Nginx to serve the new build
          EOF

      - name: Deploy backend to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
              # On EC2, navigate to backend directory, install dependencies and start PM2
              cd ~/server  # Ensure you're in the backend directory
              npm install
              pm2 stop backend || true  # Stop the existing process if it exists
              pm2 start server.js --name backend  # Start your backend process with PM2
              pm2 save  # Save PM2 process list to restart on server reboot
          EOF
