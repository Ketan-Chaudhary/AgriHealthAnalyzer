version: '3.8'

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
     - "5173:80"
    depends_on:
      - backend
  
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PLANT_ID_API_KE=${PLANT_ID_API_KEY}